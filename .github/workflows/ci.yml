name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A stuck step fails after 15 minutes instead of running for hours.
    timeout-minutes: 15
    # Playwright's official image already contains Chromium, Firefox and WebKit plus their system libraries.
    # Installing them on the runner (apt-get and browser downloads) kept stalling, so CI doesn't do that.
    # Keep this tag in step with @playwright/test in package.json (the "Check Playwright version" step enforces it).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check Playwright version matches the container image
        run: |
          installed="$(node -p "require('@playwright/test/package.json').version")"
          if [ "$installed" != "1.64.1" ]; then
            echo "@playwright/test is $installed but the container image in ci.yml is v1.64.1-noble. Update the image tag."
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      # Browser tests run in Chromium, Firefox and WebKit (Safari's engine).
      - run: npm run test:e2e
